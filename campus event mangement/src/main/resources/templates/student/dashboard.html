<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Student Dashboard</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="mb-4">Welcome, <span th:text="${#authentication.principal.user.name}">Student</span>!</h2>
    
    <div class="row mb-5">
        <div class="col-md-6">
            <div class="card bg-primary text-white h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Upcoming Events</h5>
                    <p class="card-text fs-1" th:text="${upcomingCount}">0</p>
                    <a th:href="@{/student/events}" class="btn btn-light mt-2">Browse Events</a>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card bg-success text-white h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">My Registrations</h5>
                    <p class="card-text fs-1" th:text="${registeredCount}">0</p>
                    <a th:href="@{/student/my-registrations}" class="btn btn-light mt-2">View Registrations</a>
                </div>
            </div>
        </div>
    </div>

    <h4>Recently Listed Events</h4>
    <div class="row row-cols-1 row-cols-md-3 g-4 mt-2">
        <div class="col" th:each="event : ${recentEvents}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <span class="badge bg-info mb-2" th:text="${event.eventType}">Workshop</span>
                    <h5 class="card-title" th:text="${event.title}">Event Title</h5>
                    <p class="card-text text-muted mb-1"><small th:text="${#temporals.format(event.eventDate, 'dd MMM yyyy, HH:mm')}">Date</small></p>
                    <p class="card-text mb-2"><i class="bi bi-geo-alt"></i> <span th:text="${event.venue}">Venue</span></p>
                    <a th:href="@{/student/events/{id}(id=${event.id})}" class="btn btn-outline-primary btn-sm mt-auto">View Details</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
