<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Browse Events</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Upcoming Events</h2>
    </div>

    <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>
    <div th:if="${warningMsg}" class="alert alert-warning" th:text="${warningMsg}"></div>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="event : ${events}">
            <div class="card h-100 shadow-sm event-card hover-lift">
                <div class="card-header bg-white border-bottom-0 pt-3 pb-0">
                    <span class="badge bg-primary rounded-pill mb-2" th:text="${event.eventType}">Type</span>
                    <span class="badge bg-secondary rounded-pill mb-2" th:text="${event.department}">Dept</span>
                </div>
                <div class="card-body pt-2">
                    <h5 class="card-title" th:text="${event.title}">Event Title</h5>
                    <p class="card-text text-muted small"><i class="bi bi-calendar"></i> <span th:text="${#temporals.format(event.eventDate, 'dd MMM yyyy, HH:mm')}">Date</span></p>
                    <p class="card-text"><i class="bi bi-geo-alt"></i> <span th:text="${event.venue}">Venue</span></p>
                    
                    <div class="mt-3">
                        <small class="text-muted d-block mb-1">Capacity: <span th:text="${event.currentRegistrations}"></span> / <span th:text="${event.maxCapacity}"></span></small>
                        <div class="progress" style="height: 5px;">
                            <div class="progress-bar" role="progressbar" th:style="'width: ' + (${event.maxCapacity} > 0 ? (${event.currentRegistrations} * 100 / ${event.maxCapacity}) : 0) + '%'" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                    </div>
                </div>
                <div class="card-footer bg-white border-top-0 pb-3">
                    <a th:href="@{/student/events/{id}(id=${event.id})}" class="btn btn-outline-primary w-100">View Details & Register</a>
                </div>
            </div>
        </div>
        <div class="col-12 text-center py-5" th:if="${#lists.isEmpty(events)}">
            <h4 class="text-muted">No upcoming events found.</h4>
        </div>
    </div>
</div>
</body>
</html>
