<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Manage Events</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Manage Events</h2>
        <a th:href="@{/admin/events/new}" class="btn btn-primary">Create Event</a>
    </div>

    <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Type</th>
                            <th>Title</th>
                            <th>Date</th>
                            <th>Registrations</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="e : ${events}">
                            <td><span class="badge bg-secondary" th:text="${e.eventType}">Type</span></td>
                            <td class="fw-bold" th:text="${e.title}">Title</td>
                            <td th:text="${#temporals.format(e.eventDate, 'dd MMM yyyy, HH:mm')}">Date</td>
                            <td><span th:text="${e.currentRegistrations}"></span> / <span th:text="${e.maxCapacity}"></span></td>
                            <td>
                                <a th:href="@{/admin/events/{id}/edit(id=${e.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                                <form th:action="@{/admin/events/{id}(id=${e.id})}" method="post" class="d-inline">
                                    <input type="hidden" name="_method" value="delete"/>
                                    <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure you want to delete this event?')">Delete</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(events)}">
                            <td colspan="5" class="text-center py-4 text-muted">No events currently listed.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
