<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Server Error</title>
</head>
<body>
<div layout:fragment="content" class="text-center py-5">
    <h1 class="display-1 fw-bold text-danger">500</h1>
    <h3 class="mb-4">Internal Server Error</h3>
    <p class="text-muted mb-4" th:text="${errorMessage}">Something went wrong on our end. Please try again later.</p>
    <a th:href="@{/}" class="btn btn-primary">Go to Home</a>
</div>
</body>
</html>
