<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Page Not Found</title>
</head>
<body>
<div layout:fragment="content" class="text-center py-5">
    <h1 class="display-1 fw-bold text-danger">404</h1>
    <h3 class="mb-4">Oops! Page not found.</h3>
    <p class="text-muted mb-4" th:text="${errorMessage}">The page you are looking for does not exist or has been moved.</p>
    <a th:href="@{/}" class="btn btn-primary">Go to Home</a>
</div>
</body>
</html>
